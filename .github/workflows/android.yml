name: On Player Android APK Build
on:
 push:
  branches: [ main, master, fix/on-player-apk-build ]
 pull_request:
  branches: [ main, master ]
 workflow_dispatch:
permissions:
 contents: read
concurrency:
 group: on-player-build-${{ github.head_ref || github.ref_name }}
 cancel-in-progress: true
jobs:
 build-apk:
  name: Build On Player APK
  runs-on: ubuntu-latest
  timeout-minutes: 18
  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
   - name: Set up Java 17
     uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Set up Gradle 8.9
     uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - name: Set up Android SDK
     uses: android-actions/setup-android@v4
     with:
      packages: platform-tools
   - name: Install required Android SDK packages
     run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
   - name: Build debug APK with retries
     shell: bash
     run: |
      for attempt in 1 2 3 4; do
       echo "Gradle build attempt $attempt/4"
       if gradle --no-daemon --stacktrace assembleDebug; then exit 0; fi
       if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
      done
      exit 1
   - name: Upload APK artifact
     uses: actions/upload-artifact@v4
     with:
      name: On-Player-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
